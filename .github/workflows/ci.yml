name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: tapescale_test
          POSTGRES_USER: tapescale
          POSTGRES_PASSWORD: tapescale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tapescale -d tapescale_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TAPESCALE_TEST_DATABASE_URL: postgresql://tapescale:tapescale_test@127.0.0.1:5432/tapescale_test
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Release build
        run: cargo build --release --bins --locked

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser JavaScript
        run: node --check web/app.js
      - name: Validate Compose files
        run: |
          TAPESCALE_POSTGRES_PASSWORD_FILE=./secrets/postgres_password.example docker compose config --quiet
          docker compose --file compose.truenas.yaml config --quiet
      - name: Build runtime image
        run: docker build --tag tapescale:ci .
