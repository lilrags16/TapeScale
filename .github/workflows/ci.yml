name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: tapescale_test
          POSTGRES_USER: tapescale
          POSTGRES_PASSWORD: tapescale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tapescale -d tapescale_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TAPESCALE_TEST_DATABASE_URL: postgresql://tapescale:tapescale_test@127.0.0.1:5432/tapescale_test
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Release metadata consistency
        run: scripts/check-release-consistency.sh
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Release build
        run: cargo build --release --bins --locked

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser JavaScript
        run: |
          node --check web/app.js
          node --test scripts/test-web-backup-ux.mjs
      - name: Validate Compose files
        run: |
          TAPESCALE_POSTGRES_PASSWORD_FILE=./secrets/postgres_password.example docker compose config --quiet
          docker compose --file compose.truenas.yaml config --quiet
      - name: Build runtime image
        run: docker build --tag tapescale:ci .
      - name: Validate native runtime contents
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/sh \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            tapescale:ci \
            -ec '
              command -v dar
              command -v mt-st
              for executable in btape bconsole bacula-dir bacula-sd bacula-fd dbcheck; do
                ! command -v "$executable"
              done
              dar -V >/tmp/dar-version 2>&1
              grep -F "dar version 2.8.6" /tmp/dar-version
              grep -E "gzip compression \(libz\) +: YES$" /tmp/dar-version
              grep -E "zstd compression \(libzstd\) +: YES$" /tmp/dar-version
              grep -E "lz4 compression \(liblz4\) +: YES$" /tmp/dar-version
              grep -F "Multiple threads (libthreads): YES (1.6.1" /tmp/dar-version
              test ! -e /var/lib/bacula
              test ! -e /var/lib/tapescale/bacula
              test ! -e /etc/bacula
              test ! -e /run/bacula
              test -d /var/lib/tapescale/spool
              test -d /var/lib/tapescale/recovery
            '
      - name: Exercise source-independent native DAR roundtrips
        run: |
          set -euo pipefail
          for codec in zstd lz4; do
            docker run --rm \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --env "NATIVE_CI_COMPRESSION=$codec" \
              --volume "$GITHUB_WORKSPACE/scripts/ci-native-dar-roundtrip.sh:/usr/local/bin/ci-native-dar-roundtrip:ro" \
              --entrypoint /usr/local/bin/ci-native-dar-roundtrip \
              tapescale:ci
          done
      - name: Verify capability-free native spool access
        run: |
          set -euo pipefail
          native_spool="tapescale-ci-native-spool-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker volume rm --force "$native_spool" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$native_spool"
          docker run --rm \
            --entrypoint /bin/sh \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --volume "$native_spool:/var/lib/tapescale/spool" \
            tapescale:ci \
            -ec 'test "$(stat -c "%u:%g:%a" /var/lib/tapescale/spool)" = "10001:0:770"; mkdir /var/lib/tapescale/spool/ci-write-test; touch /var/lib/tapescale/spool/ci-write-test/archive.000001.dar'
