name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: tapescale_test
          POSTGRES_USER: tapescale
          POSTGRES_PASSWORD: tapescale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tapescale -d tapescale_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TAPESCALE_TEST_DATABASE_URL: postgresql://tapescale:tapescale_test@127.0.0.1:5432/tapescale_test
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Release build
        run: cargo build --release --bins --locked

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser JavaScript
        run: node --check web/app.js
      - name: Validate Compose files
        run: |
          TAPESCALE_POSTGRES_PASSWORD_FILE=./secrets/postgres_password.example docker compose config --quiet
          docker compose --file compose.truenas.yaml config --quiet
      - name: Build runtime image
        run: docker build --tag tapescale:ci .
      - name: Validate packaged Bacula schema
        run: >-
          docker run --rm
          --entrypoint /usr/local/bin/tapescale-worker
          tapescale:ci
          --validate-bacula-schema
      - name: Exercise fresh Bacula backup, Data verify, restore, and catalog proof
        run: |
          set -euo pipefail
          catalog_network="tapescale-ci-catalog-${GITHUB_RUN_ID}"
          catalog_postgres="tapescale-ci-postgres-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$catalog_postgres" >/dev/null 2>&1 || true
            docker network rm "$catalog_network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$catalog_network"
          docker run --detach \
            --name "$catalog_postgres" \
            --network "$catalog_network" \
            --network-alias postgres \
            --env POSTGRES_DB=tapescale \
            --env POSTGRES_USER=tapescale \
            --env POSTGRES_PASSWORD=tapescale_ci \
            postgres:16.15-bookworm
          for attempt in $(seq 1 30); do
            if docker exec "$catalog_postgres" pg_isready --username tapescale --dbname tapescale; then
              break
            fi
            if test "$attempt" = 30; then
              docker logs "$catalog_postgres"
              exit 1
            fi
            sleep 1
          done
          docker run --rm \
            --network "$catalog_network" \
            --user 0:0 \
            --env DATABASE_URL=postgresql://tapescale:tapescale_ci@postgres:5432/tapescale \
            --env BACULA_CATALOG_HOST=postgres \
            --env BACULA_CATALOG_PORT=5432 \
            --env BACULA_CATALOG_DATABASE=tapescale \
            --env BACULA_CATALOG_USER=tapescale \
            --env BACULA_CATALOG_PASSWORD=tapescale_ci \
            --volume "$GITHUB_WORKSPACE/scripts/ci-bacula-file-roundtrip.sh:/usr/local/bin/ci-bacula-file-roundtrip:ro" \
            --entrypoint /usr/local/bin/ci-bacula-file-roundtrip \
            tapescale:ci
          catalog_result="$(docker exec \
            --env PGPASSWORD=tapescale_ci \
            "$catalog_postgres" \
            psql --username tapescale --dbname tapescale --tuples-only --no-align \
            --command "SELECT versionid || '|' || (to_regclass('public.job') IS NOT NULL)::text || '|' || (to_regclass('public.media') IS NOT NULL)::text FROM public.version")"
          test "$catalog_result" = "1026|true|true"
      - name: Verify capability-free worker state access
        run: |
          docker volume create tapescale-ci-engine-state
          docker run --rm \
            --entrypoint /bin/sh \
            --user 0:0 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --volume tapescale-ci-engine-state:/var/lib/tapescale/bacula \
            tapescale:ci \
            -ec 'test "$(stat -c "%u:%g:%a" /var/lib/tapescale/bacula/qualifications)" = "10001:0:770"; mkdir /var/lib/tapescale/bacula/qualifications/ci-write-test; touch /var/lib/tapescale/bacula/qualifications/ci-write-test/bacula-sd.conf'
          docker volume rm tapescale-ci-engine-state
