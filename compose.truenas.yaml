# TapeScale alpha TrueNAS deployment for an isolated attended environment.
# Disposable credentials are intentionally embedded; this is not a production security model.
# The worker expects one standalone SAS tape drive at /dev/nst0. If TrueNAS
# exposes /dev/nst1 instead, set TAPESCALE_TAPE_DEVICES and both sides of the
# device mapping to /dev/nst1 so the container path matches Linux sysfs.
# This alpha stack exposes status, rewind, unload, an attended Bacula btape
# qualification run with a guided tape-initialization flow, an attended Backup
# Center with graphical source browsing, operator-attended multi-cartridge
# full-file writes, selectable Bacula compression, physical readback, retained
# manifest browsing, the narrower G0.2 recovery exercise,
# recovery evidence/planning, attended multi-volume complete-point or
# single-volume selected-path read-only verified-point rehearsal,
# confirmed manual media-custody operations, and a fail-closed media console.
# Qualification, operational backup, and the initial G0.2 exercise deliberately
# overwrite the loaded tape; the later rehearsal reads it. Use scratch media for
# every destructive workflow. No unattended tape selection is performed.
# Before installing, create /mnt/tapescale-restores as an isolated restore dataset
# with a Generic/POSIX-compatible ACL preset and no SMB or NFS share.
# /mnt is exposed read-only as /source so the UI can select an immutable
# .zfs/snapshot subpath; it is never a writable source mount.
# Paste this entire file into Apps > Discover Apps > Install via YAML.

name: tapescale

x-tapescale-common: &tapescale-common
  build:
    context: https://github.com/lilrags16/TapeScale.git#v0.1.0-alpha.8
    args:
      TAPESCALE_VERSION: 0.1.0-alpha.8
      TAPESCALE_REVISION: v0.1.0-alpha.8
  image: tapescale:0.1.0-alpha.8
  pull_policy: build
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
    - /etc/tapescale:size=1m,mode=0700
    - /run/bacula:size=4m,mode=0750
  environment: &tapescale-environment
    TAPESCALE_DEMO_MODE: "false"
    TAPESCALE_LAB_TAPE_MOTION_ENABLED: "true"
    TAPESCALE_LAB_TAPE_QUALIFICATION_ENABLED: "true"
    TAPESCALE_LAB_FILE_ROUNDTRIP_ENABLED: "true"
    TAPESCALE_SOURCE_ROOT: /source
    TAPESCALE_RESTORE_ROOT: /restore
    DATABASE_URL: postgresql://tapescale:tapescale_test_only_password@postgres:5432/tapescale
    RUST_LOG: tapescale=info,tower_http=info
  networks:
    - control
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *tapescale-common
    user: "0:0"
    cap_add: [DAC_READ_SEARCH]
    ports:
      - "18080:8080"
    networks:
      - control
      - edge
    volumes:
      - worker_recovery:/var/lib/tapescale/recovery:ro
      - /mnt:/source:ro
      - type: bind
        source: /mnt/tapescale-restores
        target: /restore
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
          pids: 256

  worker:
    <<: *tapescale-common
    entrypoint: [/usr/local/bin/tapescale-worker]
    stop_grace_period: 15m
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, FSETID]
    environment:
      <<: *tapescale-environment
      TAPESCALE_WORKER_POLL_SECS: "5"
      TAPESCALE_TAPE_DEVICES: /dev/nst0
      TAPESCALE_SYSFS_ROOT: /sys
      TAPESCALE_MT_PATH: /usr/bin/mt-st
      TAPESCALE_BTAPE_PATH: /usr/sbin/btape
      TAPESCALE_BCONSOLE_PATH: /usr/sbin/bconsole
      TAPESCALE_BACULA_STATE_DIR: /var/lib/tapescale/bacula
      # Up to 64 GiB of data buffering plus an 8 GiB filesystem reserve.
      # TapeScale also reserves an archive-specific attribute-spool allowance.
      # Bacula drains a full data buffer and continues, so this is no size cap.
      TAPESCALE_BACULA_SPOOL_MAX_BYTES: "68719476736"
      TAPESCALE_BACULA_SPOOL_RESERVE_BYTES: "8589934592"
      TAPESCALE_BACULA_SPOOL_MIN_BYTES: "8589934592"
      TAPESCALE_QUALIFICATION_TIMEOUT_SECS: "1800"
      TAPESCALE_DATA_RUN_TIMEOUT_SECS: "43200"
    healthcheck:
      disable: true
    devices:
      - /dev/nst0:/dev/nst0:rwm
    volumes:
      - worker_recovery:/var/lib/tapescale/recovery
      - worker_spool:/var/lib/tapescale/spool
      - worker_engine_state:/var/lib/tapescale/bacula
      - worker_bacula_runtime:/var/lib/bacula
      - /mnt:/source:ro
      - type: bind
        source: /mnt/tapescale-restores
        target: /restore
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"
          pids: 256

  scheduler:
    <<: *tapescale-common
    entrypoint: [/usr/local/bin/tapescale-scheduler]
    environment:
      <<: *tapescale-environment
      TAPESCALE_WORKER_POLL_SECS: "30"
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256

  postgres:
    image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: tapescale
      POSTGRES_USER: tapescale
      POSTGRES_PASSWORD: tapescale_test_only_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=3775
    networks:
      - control
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tapescale -d tapescale]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
          pids: 256

volumes:
  postgres_data:
  # PostgreSQL retains plans, requests, inventory, runs, and recovery evidence.
  worker_recovery:
  worker_spool:
  worker_engine_state:
  worker_bacula_runtime:

networks:
  edge:
  control:
    internal: true
