# Test-only TrueNAS deployment. Credentials are intentionally embedded.
# Paste this entire file into Apps > Discover Apps > Install via YAML.

name: tapescale

x-tapescale-common: &tapescale-common
  build:
    context: https://github.com/lilrags16/TapeScale.git#main
    args:
      TAPESCALE_VERSION: 0.1.0-test
  image: tapescale:test
  pull_policy: build
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  environment: &tapescale-environment
    TAPESCALE_DEMO_MODE: "true"
    DATABASE_URL: postgresql://tapescale:tapescale_test_only_password@postgres:5432/tapescale
    RUST_LOG: tapescale=info,tower_http=info
  pids_limit: 256
  networks:
    - control
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *tapescale-common
    ports:
      - "18080:8080"
    networks:
      - control
      - edge
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  worker:
    <<: *tapescale-common
    entrypoint: [/usr/local/bin/tapescale-worker]
    environment:
      <<: *tapescale-environment
      TAPESCALE_WORKER_POLL_SECS: "5"
    healthcheck:
      disable: true
    volumes:
      - recovery_exports:/var/lib/tapescale/recovery
      - spool:/var/lib/tapescale/spool
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"

  scheduler:
    <<: *tapescale-common
    entrypoint: [/usr/local/bin/tapescale-scheduler]
    environment:
      <<: *tapescale-environment
      TAPESCALE_SITE_TIMEZONE: UTC
      TAPESCALE_WORKER_POLL_SECS: "30"
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      POSTGRES_DB: tapescale
      POSTGRES_USER: tapescale
      POSTGRES_PASSWORD: tapescale_test_only_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=3775
    networks:
      - control
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tapescale -d tapescale]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

volumes:
  postgres_data:
  recovery_exports:
  spool:

networks:
  edge:
  control:
    internal: true
