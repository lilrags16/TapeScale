# TapeScale alpha TrueNAS deployment for an isolated attended environment.
# Disposable credentials are intentionally embedded; this is not a production security model.
# The worker expects one standalone SAS tape drive at /dev/nst0. If TrueNAS
# exposes /dev/nst1 instead, set TAPESCALE_TAPE_DEVICES and both sides of the
# device mapping to /dev/nst1 so the container path matches Linux sysfs.
# This alpha stack exposes status, rewind, unload, native TapeScale tape
# preparation, graphical source browsing, compressed DAR archive creation,
# operator-attended multi-cartridge writes, immediate physical readback, retained
# manifest browsing, recovery evidence, confirmed manual media-custody operations,
# and a fail-closed media console. Preparation and operational backup deliberately
# overwrite loaded scratch media. No unattended tape selection is performed.
# Before installing, create /mnt/tapescale-restores as an isolated restore dataset
# and /mnt/tapescale-spool as a large dedicated staging dataset, preferably on
# SSD/NVMe. Give both a Generic/POSIX-compatible ACL preset and no SMB/NFS share.
# The worker runs as container root and must be able to create and fsync files in
# /mnt/tapescale-spool; verify that before the first backup.
# /mnt is exposed read-only as /source so the UI can select an immutable
# .zfs/snapshot subpath; it is never a writable source mount.
# Paste this entire file into Apps > Discover Apps > Install via YAML.

name: tapescale

x-tapescale-common: &tapescale-common
  build:
    context: https://github.com/lilrags16/TapeScale.git#v0.2.0-alpha.5
    args:
      TAPESCALE_VERSION: 0.2.0-alpha.5
      TAPESCALE_REVISION: v0.2.0-alpha.5
  image: tapescale:0.2.0-alpha.5
  pull_policy: build
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  environment: &tapescale-environment
    TAPESCALE_DEMO_MODE: "false"
    TAPESCALE_TAPE_MOTION_ENABLED: "true"
    TAPESCALE_TAPE_PREPARATION_ENABLED: "true"
    TAPESCALE_NATIVE_BACKUP_ENABLED: "true"
    TAPESCALE_SOURCE_ROOT: /source
    TAPESCALE_RESTORE_ROOT: /restore
    DATABASE_URL: postgresql://tapescale:tapescale_test_only_password@postgres:5432/tapescale
    RUST_LOG: tapescale=info,tower_http=info
  networks:
    - control
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *tapescale-common
    user: "0:0"
    cap_add: [DAC_READ_SEARCH]
    ports:
      - "18080:8080"
    networks:
      - control
      - edge
    volumes:
      - worker_recovery:/var/lib/tapescale/recovery:ro
      - /mnt:/source:ro
      - type: bind
        source: /mnt/tapescale-restores
        target: /restore
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
          pids: 256

  worker:
    <<: *tapescale-common
    entrypoint: [/usr/local/bin/tapescale-worker]
    stop_grace_period: 15m
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, FSETID]
    environment:
      <<: *tapescale-environment
      TAPESCALE_WORKER_POLL_SECS: "5"
      TAPESCALE_TAPE_DEVICES: /dev/nst0
      TAPESCALE_SYSFS_ROOT: /sys
      TAPESCALE_MT_PATH: /usr/bin/mt-st
      TAPESCALE_DAR_PATH: /usr/local/bin/dar
      # DAR completes and validates this staged archive before tape motion begins,
      # so source traversal and compression cannot starve the physical drive.
      TAPESCALE_NATIVE_SPOOL_DIR: /var/lib/tapescale/spool
      TAPESCALE_NATIVE_SPOOL_RESERVE_BYTES: "8589934592"
      TAPESCALE_NATIVE_SLICE_BYTES: "68719476736"
      TAPESCALE_NATIVE_COMPRESSION_THREADS: "4"
      TAPESCALE_QUALIFICATION_TIMEOUT_SECS: "1800"
      TAPESCALE_DATA_RUN_TIMEOUT_SECS: "43200"
      TAPESCALE_TRANSFER_STALL_TIMEOUT_SECS: "1800"
    healthcheck:
      disable: true
    devices:
      - /dev/nst0:/dev/nst0:rwm
    volumes:
      - worker_recovery:/var/lib/tapescale/recovery
      - type: bind
        source: /mnt/tapescale-spool
        target: /var/lib/tapescale/spool
        bind:
          create_host_path: false
      - /mnt:/source:ro
      - type: bind
        source: /mnt/tapescale-restores
        target: /restore
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"
          pids: 256

  scheduler:
    <<: *tapescale-common
    entrypoint: [/usr/local/bin/tapescale-scheduler]
    environment:
      <<: *tapescale-environment
      TAPESCALE_WORKER_POLL_SECS: "30"
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256

  postgres:
    image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: tapescale
      POSTGRES_USER: tapescale
      POSTGRES_PASSWORD: tapescale_test_only_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=3775
    networks:
      - control
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tapescale -d tapescale]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
          pids: 256

volumes:
  postgres_data:
  # PostgreSQL retains plans, requests, inventory, runs, and recovery evidence.
  worker_recovery:

networks:
  edge:
  control:
    internal: true
