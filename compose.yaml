name: tapescale

x-tapescale-common: &tapescale-common
  build:
    context: .
    args:
      TAPESCALE_VERSION: ${TAPESCALE_VERSION:-0.1.0-alpha.4}
      TAPESCALE_REVISION: ${TAPESCALE_REVISION:-development}
  image: tapescale:${TAPESCALE_VERSION:-0.1.0-alpha.4}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
    - /etc/tapescale:size=1m,mode=0700
    - /run/bacula:size=4m,mode=0750
  secrets:
    - postgres_password
  environment: &tapescale-environment
    TAPESCALE_DEMO_MODE: ${TAPESCALE_DEMO_MODE:-false}
    TAPESCALE_LAB_TAPE_MOTION_ENABLED: ${TAPESCALE_LAB_TAPE_MOTION_ENABLED:-false}
    TAPESCALE_LAB_TAPE_QUALIFICATION_ENABLED: ${TAPESCALE_LAB_TAPE_QUALIFICATION_ENABLED:-false}
    TAPESCALE_LAB_FILE_ROUNDTRIP_ENABLED: ${TAPESCALE_LAB_FILE_ROUNDTRIP_ENABLED:-false}
    TAPESCALE_SOURCE_ROOT: /source
    TAPESCALE_RESTORE_ROOT: /restore
    TAPESCALE_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    TAPESCALE_DATABASE_HOST: postgres
    TAPESCALE_DATABASE_PORT: 5432
    TAPESCALE_DATABASE_USER: tapescale
    TAPESCALE_DATABASE_NAME: tapescale
    RUST_LOG: ${RUST_LOG:-tapescale=info,tower_http=info}
  networks:
    - control
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *tapescale-common
    user: "0:0"
    cap_add: [DAC_READ_SEARCH]
    ports:
      - "${TAPESCALE_HTTP_PORT:-8080}:8080"
    networks:
      - control
      - edge
    volumes:
      - recovery_exports:/var/lib/tapescale/recovery:ro
      - ${TAPESCALE_SOURCE_HOST_PATH:-./fixtures}:/source:ro
      - type: bind
        source: ${TAPESCALE_RESTORE_HOST_PATH:-./restore}
        target: /restore
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
          pids: 256

  worker:
    <<: *tapescale-common
    entrypoint: [/usr/local/bin/tapescale-worker]
    stop_grace_period: 15m
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, FSETID]
    environment:
      <<: *tapescale-environment
      TAPESCALE_WORKER_POLL_SECS: ${TAPESCALE_WORKER_POLL_SECS:-5}
      TAPESCALE_TAPE_DEVICES: ${TAPESCALE_TAPE_DEVICES:-}
      TAPESCALE_SYSFS_ROOT: ${TAPESCALE_SYSFS_ROOT:-/sys}
      TAPESCALE_MT_PATH: ${TAPESCALE_MT_PATH:-/usr/bin/mt-st}
      TAPESCALE_BTAPE_PATH: ${TAPESCALE_BTAPE_PATH:-/usr/sbin/btape}
      TAPESCALE_BCONSOLE_PATH: ${TAPESCALE_BCONSOLE_PATH:-/usr/sbin/bconsole}
      TAPESCALE_BACULA_STATE_DIR: /var/lib/tapescale/bacula
      TAPESCALE_BACULA_SPOOL_MAX_BYTES: ${TAPESCALE_BACULA_SPOOL_MAX_BYTES:-68719476736}
      TAPESCALE_BACULA_SPOOL_RESERVE_BYTES: ${TAPESCALE_BACULA_SPOOL_RESERVE_BYTES:-8589934592}
      TAPESCALE_BACULA_SPOOL_MIN_BYTES: ${TAPESCALE_BACULA_SPOOL_MIN_BYTES:-8589934592}
      TAPESCALE_QUALIFICATION_TIMEOUT_SECS: ${TAPESCALE_QUALIFICATION_TIMEOUT_SECS:-1800}
      TAPESCALE_DATA_RUN_TIMEOUT_SECS: ${TAPESCALE_DATA_RUN_TIMEOUT_SECS:-43200}
    healthcheck:
      disable: true
    volumes:
      - recovery_exports:/var/lib/tapescale/recovery
      - spool:/var/lib/tapescale/spool
      - engine_state:/var/lib/tapescale/bacula
      - bacula_runtime:/var/lib/bacula
      - ${TAPESCALE_SOURCE_HOST_PATH:-./fixtures}:/source:ro
      - type: bind
        source: ${TAPESCALE_RESTORE_HOST_PATH:-./restore}
        target: /restore
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"
          pids: 256

  scheduler:
    <<: *tapescale-common
    entrypoint: [/usr/local/bin/tapescale-scheduler]
    environment:
      <<: *tapescale-environment
      TAPESCALE_WORKER_POLL_SECS: ${TAPESCALE_SCHEDULER_POLL_SECS:-30}
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256

  postgres:
    image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: tapescale
      POSTGRES_USER: tapescale
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=3775
    networks:
      - control
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tapescale -d tapescale]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
          pids: 256

secrets:
  postgres_password:
    file: ${TAPESCALE_POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}

volumes:
  postgres_data:
  recovery_exports:
  spool:
  engine_state:
  bacula_runtime:

networks:
  edge:
  control:
    internal: true
