name: tapescale

x-tapescale-common: &tapescale-common
  build:
    context: .
    args:
      TAPESCALE_VERSION: ${TAPESCALE_VERSION:-0.1.0}
  image: tapescale:${TAPESCALE_VERSION:-0.1.0}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  secrets:
    - postgres_password
  environment: &tapescale-environment
    TAPESCALE_DEMO_MODE: ${TAPESCALE_DEMO_MODE:-true}
    TAPESCALE_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    TAPESCALE_DATABASE_HOST: postgres
    TAPESCALE_DATABASE_PORT: 5432
    TAPESCALE_DATABASE_USER: tapescale
    TAPESCALE_DATABASE_NAME: tapescale
    RUST_LOG: ${RUST_LOG:-tapescale=info,tower_http=info}
  networks:
    - control
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *tapescale-common
    ports:
      - "${TAPESCALE_HTTP_PORT:-8080}:8080"
    networks:
      - control
      - edge
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
          pids: 256

  worker:
    <<: *tapescale-common
    entrypoint: [/usr/local/bin/tapescale-worker]
    environment:
      <<: *tapescale-environment
      TAPESCALE_WORKER_POLL_SECS: ${TAPESCALE_WORKER_POLL_SECS:-5}
    healthcheck:
      disable: true
    volumes:
      - recovery_exports:/var/lib/tapescale/recovery
      - spool:/var/lib/tapescale/spool
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"
          pids: 256

  scheduler:
    <<: *tapescale-common
    entrypoint: [/usr/local/bin/tapescale-scheduler]
    environment:
      <<: *tapescale-environment
      TAPESCALE_SITE_TIMEZONE: ${TAPESCALE_SITE_TIMEZONE:-UTC}
      TAPESCALE_WORKER_POLL_SECS: ${TAPESCALE_SCHEDULER_POLL_SECS:-30}
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256

  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: tapescale
      POSTGRES_USER: tapescale
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=3775
    networks:
      - control
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tapescale -d tapescale]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
          pids: 256

secrets:
  postgres_password:
    file: ${TAPESCALE_POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}

volumes:
  postgres_data:
  recovery_exports:
  spool:

networks:
  edge:
  control:
    internal: true
